[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-gbs-agent"
version = "1.0.0"
description = "Ask GBS — Enterprise Finance & Procurement Helpdesk ADK Agent with Gemini Enterprise A2UI v0.9 Canvas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Enterprise GBS AI Engineering" }
]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-dlp>=3.21.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "python-json-logger>=2.0.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["ask_gbs_agent*"]

[tool.setuptools.package-data]
ask_gbs_agent = ["data/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
